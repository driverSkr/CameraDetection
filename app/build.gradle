plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt' // 必须添加 kapt 插件
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace "com.spyfinder.hiddencamera.detectorapp"
    compileSdk project.COMPILE_SDK_VERSION as int

    defaultConfig {
        applicationId "com.spyfinder.hiddencamera.detectorapp"
        minSdk project.MIN_SDK_VERSION as int
        targetSdk project.TARGET_SDK_VERSION as int
        versionCode project.APP_VERSION_CODE as int
        versionName "${APP_VERSION_NAME}"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        ndk {
            //'x86', 'x86_64'：Intel架构，曾经被许多PC和一些Android设备使用
            //noinspection ChromeOsAbiSupport
            abiFilters 'armeabi-v7a', 'arm64-v8a' // 仅支持这两个架构
        }
    }

    signingConfigs {
        //release版本,打包机配置
        release {
            storeFile file("$rootDir$KEY_STORE_PATH")
            storePassword project.KEY_STORE_PWD
            keyAlias project.KEY_STORE_ALIAS
            keyPassword project.KEY_STORE_PWD
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    // 禁用多语言分包
    bundle {
        language {
            enableSplit = false
        }
    }

    flavorDimensions = ["appConfig"]
    productFlavors {
        //正式版
        prodVersion {
            dimension "appConfig"
            manifestPlaceholders = ['useHttp': false]
            buildConfigField("boolean", "isVideoTest", "false")
            proguardFile 'log-proguard-rules.pro' //正式版本混淆掉日志
        }
        //内网版
        innerVersion {
            dimension "appConfig"
            manifestPlaceholders = ['useHttp': true]
            buildConfigField("boolean", "isVideoTest", "false")
        }
        //开发版
        devVersion {
            dimension "appConfig"
            manifestPlaceholders = ['useHttp': false]
            buildConfigField("boolean", "isVideoTest", "false")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    buildFeatures {
        compose true
        viewBinding true
        buildConfig true
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    packaging {
        jniLibs {
            // 显式关闭 legacy packaging，确保 APK 中的 so 以可页对齐方式打包。
            useLegacyPackaging = false
        }
    }
    lintOptions {
        disable "Instantiatable"
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.5'
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.activity.ktx
    implementation libs.material
    implementation libs.androidx.activity

    //================================compose dependencies area==============================
    def composeBom = platform(libs.androidx.compose.bom)
    implementation composeBom
    androidTestImplementation composeBom
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.process
    testImplementation libs.junit
    testImplementation libs.org.json
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.junit
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.wear.compose.material
    implementation libs.androidx.compose.material
    implementation libs.androidx.compose.material3
    implementation libs.androidx.navigation.compose
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest

//    implementation "com.android.support:multidex:${MULTIDEX_VERSION}"
    implementation libs.androidx.multidex
    //================================compose dependencies area==============================
    implementation libs.blankj.utilcode
    implementation libs.skydoves.bundler
    implementation libs.google.play.review
    //高斯模糊
    implementation libs.centerzx.shape.blur.view
    implementation libs.chrisbanes.haze.materials //compose 使用的动态模糊库，性能开销小，仅支持33以上

    // CameraX
    // 升级到稳定版，修复旧版 CameraX 附带的 native so 仅 4KB 对齐的问题。
    implementation libs.androidx.camera.core
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.view
    // CameraX 的 ProcessCameraProvider API 暴露了 Guava ListenableFuture，显式引入 Android 版 Guava，避免被空 listenablefuture 占位包替换后编译期找不到类。
    implementation libs.google.guava
    //=========================================libs=========================================
    implementation project(path: ':Libs:Base')
    implementation project(path: ':Libs:Permission')
    implementation project(path: ':Libs:GPay')
    implementation project(path: ':Libs:FirebaseAnalytics')
}
